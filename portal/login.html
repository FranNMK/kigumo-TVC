<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Kigumo Technical and Vocational College School Portal Login - Access your student or staff dashboard">
    <meta name="theme-color" content="#1a7a1a">
    <title>School Portal Login - Kigumo Technical and Vocational College</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="/assets/css/main.css">

    <!-- Google Translate Widget -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {
                    pageLanguage: 'en',
                    includedLanguages: 'sw',
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
                },
                'google_translate_element'
            );
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        /* Login Page Specific Styles */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1a1a2e 0%, #1a7a1a 100%);
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .login-header {
            background: #ffffff;
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            border-bottom: 3px solid #1a7a1a;
        }

        .login-logo {
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #1a7a1a;
            padding: 4px;
            margin: 0 auto 1rem auto;
            object-fit: cover;
        }

        .login-header h1 {
            color: #1a1a2e;
            font-size: 1.5rem;
            margin: 0.5rem 0;
            font-weight: 700;
        }

        .login-header p {
            color: #666666;
            font-size: 0.95rem;
            margin: 0;
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            color: #1a1a2e;
            background: #f8f9fa;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #1a7a1a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 122, 26, 0.1);
        }

        .form-input.error {
            border-color: #dc3545;
            background: #fff8f8;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            padding: 4px;
            font-size: 1.1rem;
            line-height: 1;
        }

        .password-toggle:hover {
            color: #1a7a1a;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.4rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .login-button {
            width: 100%;
            padding: 0.85rem;
            background: #1a7a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .login-button:hover {
            background: #145214;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 122, 26, 0.3);
        }

        .login-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem 2rem;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer a {
            color: #1a7a1a;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #145214;
            text-decoration: underline;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .alert.visible {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-top: 3px solid #f5c518;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .login-button.loading .login-button-text {
            display: none;
        }

        .login-button.loading .loading-spinner {
            display: inline-block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .login-card {
                margin: 0 1rem;
                border-radius: 8px;
            }

            .login-header {
                padding: 2rem 1.5rem 1rem;
            }

            .login-logo {
                width: 80px;
                height: 80px;
            }

            .login-body {
                padding: 1.5rem;
            }

            .login-footer {
                padding: 1rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Google Translate Element -->
    <div id="google_translate_element" style="position: fixed; top: 10px; right: 10px; z-index: 9999;"></div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <!-- Login Header -->
                <div class="login-header">
                    <img src="../../assets/images/logo.jpeg" alt="Kigumo TVC Logo" class="login-logo">
                    <h1>School Portal</h1>
                    <p>Kigumo Technical &amp; Vocational College</p>
                </div>

                <!-- Login Form -->
                <div class="login-body">
                    <!-- Success/Error Alert -->
                    <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

                    <form id="loginForm" novalidate autocomplete="off">
                        <!-- Identifier Field -->
                        <div class="form-group">
                            <label for="identifier">
                                Student Admission No. or Email
                            </label>
                            <div class="input-wrapper">
                                <input type="text" id="identifier" name="identifier" class="form-input"
                                    placeholder="e.g. DICT/2501/1712 or user@email.com" required autocomplete="username"
                                    aria-required="true" aria-describedby="identifierError">
                            </div>
                            <span id="identifierError" class="error-message">
                                Please enter your admission number or email address.
                            </span>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group">
                            <label for="password">
                                Password (your phone number)
                            </label>
                            <div class="input-wrapper">
                                <input type="password" id="password" name="password" class="form-input"
                                    placeholder="Enter your phone number" required autocomplete="current-password"
                                    aria-required="true" aria-describedby="passwordError">
                                <button type="button" class="password-toggle" id="passwordToggle"
                                    aria-label="Toggle password visibility">
                                    👁️
                                </button>
                            </div>
                            <span id="passwordError" class="error-message">
                                Please enter your password.
                            </span>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" id="loginButton" class="login-button">
                            <span class="loading-spinner"></span>
                            <span class="login-button-text">Log In</span>
                        </button>
                    </form>

                    <!-- Back to Website Link -->
                    <div class="back-link">
                        <a href="/" title="Return to college website">
                            ← Back to Website
                        </a>
                    </div>
                </div>

                <!-- Login Footer -->
                <div class="login-footer">
                    <a href="#" id="forgotPassword" title="Forgot password help">
                        Forgot Password?
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * School Portal Login Page Script
         * Handles form submission, validation, and authentication.
         * No frameworks - vanilla JavaScript only.
         */

        (function () {
            'use strict';

            // DOM Elements
            const loginForm = document.getElementById('loginForm');
            const identifierInput = document.getElementById('identifier');
            const passwordInput = document.getElementById('password');
            const identifierError = document.getElementById('identifierError');
            const passwordError = document.getElementById('passwordError');
            const loginButton = document.getElementById('loginButton');
            const alertBox = document.getElementById('alertBox');
            const passwordToggle = document.getElementById('passwordToggle');
            const forgotPasswordLink = document.getElementById('forgotPassword');

            /**
             * Toggle password visibility between text and password type.
             * Updates the toggle button icon accordingly.
             */
            passwordToggle.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                // Update toggle icon
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });

            /**
             * Clear field-specific error when user starts typing.
             */
            identifierInput.addEventListener('input', function () {
                this.classList.remove('error');
                identifierError.classList.remove('visible');
                hideAlert();
            });

            passwordInput.addEventListener('input', function () {
                this.classList.remove('error');
                passwordError.classList.remove('visible');
                hideAlert();
            });

            /**
             * Handle forgot password click.
             * Shows instructions to contact admin since passwords are phone numbers.
             */
            forgotPasswordLink.addEventListener('click', function (e) {
                e.preventDefault();
                showAlert(
                    'Your password is the phone number you provided during registration. ' +
                    'If you have changed your phone number, please visit the college registry ' +
                    'or contact the ICT department for assistance.',
                    'error'
                );
            });

            /**
             * Form submission handler.
             * Validates inputs, sends POST request to login endpoint.
             * 
             * @param {Event} e - Form submit event
             */
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Clear previous errors
                clearErrors();
                hideAlert();

                // Validate inputs
                let hasError = false;

                const identifier = identifierInput.value.trim();
                const password = passwordInput.value.trim();

                if (!identifier || identifier.length < 3) {
                    identifierInput.classList.add('error');
                    identifierError.classList.add('visible');
                    hasError = true;
                }

                if (!password || password.length < 4) {
                    passwordInput.classList.add('error');
                    passwordError.classList.add('visible');
                    hasError = true;
                }

                if (hasError) {
                    return;
                }

                // Show loading state
                setLoading(true);

                try {
                    // Send login request to API
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            identifier: identifier,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        // Login successful - show success and redirect
                        showAlert('Login successful! Redirecting...', 'success');

                        // Redirect to appropriate dashboard after brief delay
                        setTimeout(() => {
                            window.location.href = data.redirectUrl;
                        }, 800);

                    } else {
                        // Login failed
                        const errorMessage = data.message || 'Invalid credentials. Please try again.';
                        showAlert(errorMessage, 'error');

                        // Shake the card for visual feedback on error
                        shakeCard();

                        // Clear password field for security
                        passwordInput.value = '';
                        passwordInput.focus();
                    }

                } catch (error) {
                    // Network or unexpected error
                    showAlert(
                        'Unable to connect to the server. Please check your internet connection and try again.',
                        'error'
                    );
                    console.error('Login request failed:', error);

                } finally {
                    // Reset loading state
                    setLoading(false);
                }
            });

            /**
             * Set loading state on login button.
             * 
             * @param {boolean} isLoading - Whether button should show loading state
             */
            function setLoading(isLoading) {
                if (isLoading) {
                    loginButton.classList.add('loading');
                    loginButton.disabled = true;
                    identifierInput.disabled = true;
                    passwordInput.disabled = true;
                } else {
                    loginButton.classList.remove('loading');
                    loginButton.disabled = false;
                    identifierInput.disabled = false;
                    passwordInput.disabled = false;
                }
            }

            /**
             * Display alert message to user.
             * 
             * @param {string} message - Alert message text
             * @param {string} type - 'success' or 'error'
             */
            function showAlert(message, type) {
                alertBox.textContent = message;
                alertBox.className = 'alert alert-' + type + ' visible';
            }

            /**
             * Hide the alert box.
             */
            function hideAlert() {
                alertBox.classList.remove('visible');
            }

            /**
             * Clear all form field error states.
             */
            function clearErrors() {
                identifierInput.classList.remove('error');
                passwordInput.classList.remove('error');
                identifierError.classList.remove('visible');
                passwordError.classList.remove('visible');
            }

            /**
             * Add shake animation to login card for error feedback.
             */
            function shakeCard() {
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                // Trigger reflow to restart animation
                card.offsetHeight;
                card.style.animation = 'shake 0.5s ease-in-out';

                // Remove animation after it completes
                setTimeout(() => {
                    card.style.animation = '';
                }, 500);
            }

            /**
             * Check if user is already logged in on page load.
             * If authenticated session exists, redirect to appropriate dashboard.
             */
            async function checkExistingSession() {
                try {
                    const response = await fetch('/api/v1/auth/me');
                    const data = await response.json();

                    if (data.success && data.user) {
                        // User is already logged in, redirect based on role
                        let redirectUrl = '/portal/login.html';

                        switch (data.user.role) {
                            case 'student':
                                redirectUrl = '/portal/student-dashboard.html';
                                break;
                            case 'lecturer':
                            case 'hod':
                                redirectUrl = '/portal/lecturer-dashboard.html';
                                break;
                            case 'deputy_principal_academics':
                            case 'deputy_principal_administration':
                            case 'chief_principal':
                                redirectUrl = '/portal/management-dashboard.html';
                                break;
                            case 'admin':
                                redirectUrl = '/portal/admin/dashboard';
                                break;
                        }

                        window.location.href = redirectUrl;
                    }
                } catch (error) {
                    // No existing session, stay on login page
                    console.log('No existing session found.');
                }
            }

            // Check for existing session on page load
            checkExistingSession();

        })();
    </script>

    <!-- CSS for shake animation (injected via script to keep HTML clean) -->
    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }
    </style>
</body>

</html>
