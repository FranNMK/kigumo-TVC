<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- title, description, canonical, og:* and JSON-LD are injected by JS once the course loads -->
  <meta name="description" content="Course details — Kigumo Technical and Vocational College" />
  <meta name="theme-color" content="#2c7a4d" />
  <title>Course Details | Kigumo Technical and Vocational College</title>
  <link rel="canonical" href="https://kigumotvc.ac.ke/courses.html" />
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ── Skeleton shimmer ─────────────────────────── */
    @keyframes cdSkeletonShimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .cd-skel {
      background: linear-gradient(90deg, #eef2f0 25%, #e0e9e4 50%, #eef2f0 75%);
      background-size: 600px 100%;
      animation: cdSkeletonShimmer 1.4s infinite linear;
      border-radius: 6px;
    }
    /* ── Skeleton layout ──────────────────────────── */
    #cdSkeleton {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: 'Inter', sans-serif;
    }
    .cd-skel-header {
      border-radius: 32px;
      padding: 40px;
      background: linear-gradient(135deg, #1e3c2c, #2c7a4d);
      margin-bottom: 32px;
      overflow: hidden;
      position: relative;
    }
    .cd-skel-header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
      background-size: 600px 100%;
      animation: cdSkeletonShimmer 1.6s infinite linear;
    }
    .cd-skel-h-line {
      height: 28px; border-radius: 6px;
      background: rgba(255,255,255,0.25);
      margin-bottom: 14px;
    }
    .cd-skel-h-line.short { width: 55%; }
    .cd-skel-h-sub  { height: 16px; border-radius: 6px; background: rgba(255,255,255,0.15); width: 80%; margin-bottom: 20px; }
    .cd-skel-h-badges { display: flex; gap: 10px; margin-top: 16px; }
    .cd-skel-h-badge  { height: 28px; width: 110px; border-radius: 40px; background: rgba(255,255,255,0.18); }
    /* card rows */
    .cd-skel-card {
      background: #fff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .cd-skel-card-title { height: 20px; width: 200px; margin-bottom: 24px; }
    .cd-skel-row {
      display: flex; justify-content: space-between;
      padding: 14px 0; border-bottom: 1px solid #eef2f0;
    }
    .cd-skel-row-lbl { height: 14px; width: 30%; }
    .cd-skel-row-val { height: 14px; width: 42%; }
  </style>

  <style>
    .course-detail-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: 'Inter', sans-serif;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2c7a4d;
      text-decoration: none;
      margin-bottom: 24px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .back-link:hover {
      transform: translateX(-4px);
    }

    .course-header {
      background: linear-gradient(135deg, #1e3c2c, #2c7a4d);
      border-radius: 32px;
      padding: 40px;
      color: white;
      margin-bottom: 32px;
    }
    .course-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .course-meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    .meta-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
    }

    .course-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .main-info {
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e3c2c;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eef2f0;
    }
    .info-label {
      font-weight: 600;
      color: #5b6e8c;
    }
    .info-value {
      font-weight: 500;
      color: #1e293b;
    }
    .exam-badge {
      display: inline-block;
      background: #eef6f2;
      color: #2c7a4d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .btn-apply, .btn-download, .btn-department {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s;
    }
    .btn-apply {
      background: #2c7a4d;
      color: white;
    }
    .btn-apply:hover {
      background: #1e5a38;
      transform: translateY(-2px);
    }
    .btn-download {
      background: #f5c518;
      color: #1a1a2e;
    }
    .btn-download:hover {
      background: #d4a800;
      transform: translateY(-2px);
    }
    .btn-department {
      background: transparent;
      color: #2c7a4d;
      border: 2px solid #2c7a4d;
    }
    .btn-department:hover {
      background: #2c7a4d;
      color: white;
      transform: translateY(-2px);
    }
    .loading-state, .error-state {
      text-align: center;
      padding: 60px;
      font-size: 1.1rem;
      color: #5b6e8c;
    }
    @media (max-width: 768px) {
      .course-header { padding: 24px; }
      .course-header h1 { font-size: 1.5rem; }
      .action-buttons { flex-direction: column; }
      .btn-apply, .btn-download, .btn-department { text-align: center; }
    }
  </style>
</head>
<body>
  <header id="mainNavbar"></header>

  <!-- ── Skeleton loading screen ─────────────────────────────── -->
  <div id="cdSkeleton">
    <a href="courses.html" class="back-link" style="display:inline-flex;align-items:center;gap:8px;color:#2c7a4d;font-weight:500;margin-bottom:24px;font-family:'Inter',sans-serif;">← Back to All Courses</a>

    <!-- Header skeleton — green card with shimmer -->
    <div class="cd-skel-header">
      <div class="cd-skel-h-line short"></div>
      <div class="cd-skel-h-sub"></div>
      <div class="cd-skel-h-badges">
        <div class="cd-skel-h-badge"></div>
        <div class="cd-skel-h-badge"></div>
        <div class="cd-skel-h-badge"></div>
      </div>
    </div>

    <!-- Content card skeleton -->
    <div class="cd-skel-card">
      <div class="cd-skel cd-skel-card-title"></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel cd-skel-card-title" style="margin-top:32px;"></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel cd-skel-card-title" style="margin-top:32px;"></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
      <div class="cd-skel-row"><div class="cd-skel cd-skel-row-lbl"></div><div class="cd-skel cd-skel-row-val"></div></div>
    </div>
  </div>

  <!-- Real content — hidden until data loads -->
  <div class="course-detail-wrapper" id="courseDetailContainer" style="display:none;opacity:0;transition:opacity 0.35s ease;">
    <a href="courses.html" class="back-link">← Back to All Courses</a>
    <div id="courseContent"></div>
  </div>

  <footer id="mainFooter"></footer>

  <script src="assets/js/navbar.js"></script>
<script>
  buildNavbar('courses');

  async function loadFooter() {
    try {
      const res = await fetch('/');
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const footer = doc.querySelector('footer');
      if (footer) document.getElementById('mainFooter').innerHTML = footer.outerHTML;
    } catch(e) { console.log('Footer load failed'); }
  }
  loadFooter();

  // Get course ID from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  const courseId = urlParams.get('id');

  // Helper: Extract Level from Name (same as courses.html)
  function getCourseLevelFromName(name) {
    const match = (name || '').match(/Level\s*(\d+)/i);
    if (match) {
      const level = parseInt(match[1]);
      if (level === 6) return 'Diploma (Level 6)';
      if (level === 5) return 'Certificate (Level 5)';
      if (level === 4) return 'Artisan (Level 4)';
      return `Level ${level}`;
    }
    return 'Short Courses'; // fallback
  }

  async function loadCourseDetails() {
    if (!courseId) {
      document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ No course selected. <a href="courses.html">Return to courses</a></div>';
      return;
    }

    try {
      // Fetch course data and global intake dates in parallel
      const [courseRes, intakesRes] = await Promise.all([
        fetch(`/api/v1/courses/${courseId}`),
        fetch('/api/v1/admin/intake-dates/public')
      ]);
      const data        = await courseRes.json();
      const intakesData = await intakesRes.json();

      if (!data.success || !data.data) {
        document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ Course not found. <a href="courses.html">Return to courses</a></div>';
        return;
      }

      const course = data.data;
      const departmentName = course.department?.name || 'General';
      const departmentId = course.department?.id;
      
      // 1. Determine level display correctly (parses "Level X" from name)
      const levelDisplay = getCourseLevelFromName(course.name);

      // 2. Format duration and modules from module_count
      let durationDisplay = '';
      const mc = course.module_count ?? 0;
      if (mc === 6) durationDisplay = '6 Modules · 3 Years (Diploma – Level 6)';
      else if (mc === 4) durationDisplay = '4 Modules · 2 Years (Certificate – Level 5)';
      else if (mc === 2) durationDisplay = '2 Modules · 1 Year (Craft Certificate – Level 4)';
      else if (mc === 1) durationDisplay = '1 Module · 6 Months (Artisan – Level 3)';
      else durationDisplay = '3 Weeks (Short / Internal Course)';

      // Flat-rate fees: Ksh 22,396 per module for all accredited programmes
      const FEE_PER_MODULE = 22396;
      let feesHtml = '';
      if (mc === 0) {
        feesHtml = '<div class="info-row"><span class="info-label" style="color:#888;">Short courses — fees vary. Contact admissions.</span></div>';
      } else {
        for (let m = 1; m <= mc; m++) {
          feesHtml += `
            <div class="info-row">
              <span class="info-label">Module ${m}</span>
              <span class="info-value">Ksh ${FEE_PER_MODULE.toLocaleString()}</span>
            </div>
          `;
        }
        feesHtml += `
          <div class="info-row" style="border-top:1px solid #e5e7eb;margin-top:6px;padding-top:6px;">
            <span class="info-label" style="font-weight:700;">Total Programme Fee</span>
            <span class="info-value" style="font-weight:700;color:#1a7a1a;">Ksh ${(mc * FEE_PER_MODULE).toLocaleString()}</span>
          </div>
        `;
      }

      // Intake dates — sourced from the global admin-managed intake_dates_global table
      const globalIntakes = (intakesData.success && intakesData.data) ? intakesData.data : [];
      let intakesHtml = '';

      if (globalIntakes.length > 0) {
        const statusBadge = s => {
          if (s === 'open')     return '<span style="display:inline-block;padding:2px 10px;border-radius:100px;font-size:.75rem;font-weight:600;background:#d4edda;color:#155724;">Open</span>';
          if (s === 'upcoming') return '<span style="display:inline-block;padding:2px 10px;border-radius:100px;font-size:.75rem;font-weight:600;background:#fff3cd;color:#856404;">Upcoming</span>';
          return '<span style="display:inline-block;padding:2px 10px;border-radius:100px;font-size:.75rem;font-weight:600;background:#f8d7da;color:#721c24;">Closed</span>';
        };
        globalIntakes.forEach(intake => {
          const deadlineStr = intake.application_deadline
            ? new Date(intake.application_deadline).toLocaleDateString('en-KE', { year: 'numeric', month: 'long', day: 'numeric' })
            : 'TBA';
          const reportingStr = intake.intake_date
            ? new Date(intake.intake_date).toLocaleDateString('en-KE', { year: 'numeric', month: 'long', day: 'numeric' })
            : 'TBA';
          intakesHtml += `
            <div class="info-row" style="flex-direction:column;align-items:flex-start;gap:6px;padding:14px 0;">
              <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
                <span class="info-label">${escapeHtml(intake.label)}</span>
                ${statusBadge(intake.status)}
              </div>
              <div style="font-size:0.85rem;color:#5b6e8c;">
                Applications close: <strong>${deadlineStr}</strong>
                &nbsp;·&nbsp; Reporting: <strong>${reportingStr}</strong>
              </div>
            </div>
          `;
        });
      } else {
        intakesHtml = '<div class="info-row"><span class="info-label" style="color:#888;">No upcoming intake dates set. Contact admissions for the latest schedule.</span></div>';
      }

      const html = `
        <div class="course-header">
          <h1>${escapeHtml(course.name)}</h1>
          <p>${escapeHtml(course.description || 'Comprehensive TVET program designed for industry readiness and practical skills development.')}</p>
          <div class="course-meta-badges">
            <span class="meta-badge">🏛️ ${escapeHtml(departmentName)}</span>
            <span class="meta-badge">📚 ${levelDisplay}</span>
            <span class="meta-badge">📋 ${escapeHtml(course.examining_body || 'N/A')}</span>
            ${course.cbet_status ? '<span class="meta-badge">✅ CBET Accredited</span>' : ''}
          </div>
        </div>
        
        <div class="course-grid">
          <div class="main-info">
            <div class="section-title">📖 Program Overview</div>
            <div class="info-row">
              <span class="info-label">Duration</span>
              <span class="info-value">${durationDisplay}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Examining Body</span>
              <span class="info-value"><span class="exam-badge">${escapeHtml(course.examining_body || 'N/A')}</span></span>
            </div>
            ${course.entry_requirements ? `
            <div class="info-row">
              <span class="info-label">Entry Requirements</span>
              <span class="info-value">${escapeHtml(course.entry_requirements)}</span>
            </div>
            ` : ''}
            
            <div class="section-title" style="margin-top: 32px;">💰 Fee Structure</div>
            ${feesHtml}
            
            <div class="section-title" style="margin-top: 32px;">📅 Intake Dates</div>
            ${intakesHtml}
            
            <div class="action-buttons">
              <a href="admissions.html" class="btn-apply">Apply Now →</a>
              <a href="downloads.html" class="btn-download">Download Brochure</a>
              <a href="departments.html#dept-${departmentId}" class="btn-department">← View Department Page</a>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('courseContent').innerHTML = html;

      // ── SEO: inject unique title, description, canonical, OG tags, and JSON-LD ──
      const pageTitle = `${course.name} | Kigumo TVC`;
      const pageDesc = course.description
        ? course.description.substring(0, 155).replace(/\s+$/, '') + (course.description.length > 155 ? '...' : '')
        : `${course.name} — ${levelDisplay} programme offered by the ${departmentName} Department at Kigumo Technical and Vocational College.`;
      const pageUrl = `https://kigumotvc.ac.ke/course-details.html?id=${courseId}`;

      document.title = pageTitle;

      // Meta description
      let metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', pageDesc);

      // Canonical
      let canonical = document.querySelector('link[rel="canonical"]');
      if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.appendChild(canonical); }
      canonical.href = pageUrl;

      // Open Graph
      const ogTags = {
        'og:title': pageTitle,
        'og:description': pageDesc,
        'og:url': pageUrl,
        'og:type': 'website',
        'og:image': 'https://kigumotvc.ac.ke/assets/images/logo.jpeg',
        'og:site_name': 'Kigumo Technical and Vocational College'
      };
      Object.entries(ogTags).forEach(([prop, content]) => {
        let el = document.querySelector(`meta[property="${prop}"]`);
        if (!el) { el = document.createElement('meta'); el.setAttribute('property', prop); document.head.appendChild(el); }
        el.setAttribute('content', content);
      });

      // JSON-LD: Course schema
      const existingLd = document.getElementById('courseJsonLd');
      if (existingLd) existingLd.remove();
      const ld = document.createElement('script');
      ld.id = 'courseJsonLd';
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Course",
        "name": course.name,
        "description": pageDesc,
        "url": pageUrl,
        "provider": {
          "@type": "EducationalOrganization",
          "name": "Kigumo Technical and Vocational College",
          "url": "https://kigumotvc.ac.ke"
        },
        "educationalLevel": levelDisplay,
        "teaches": departmentName
      });
      document.head.appendChild(ld);

      revealContent();

    } catch (err) {
      console.error('Failed to load course:', err);
      document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ Unable to load course details. Please try again later.</div>';
      revealContent();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function revealContent() {
    const skel    = document.getElementById('cdSkeleton');
    const content = document.getElementById('courseDetailContainer');
    // Fade skeleton out
    skel.style.transition = 'opacity 0.25s ease';
    skel.style.opacity    = '0';
    setTimeout(() => {
      skel.style.display  = 'none';
      content.style.display = 'block';
      // Force reflow so the transition fires
      void content.offsetWidth;
      content.style.opacity = '1';
    }, 250);
  }

  loadCourseDetails();
</script>
</body>
</html>
