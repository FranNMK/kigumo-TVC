<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Course details - Kigumo Technical and Vocational College" />
  <meta name="theme-color" content="#2c7a4d" />
  <title>Course Details | Kigumo Technical and Vocational College</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

  <style>
    .course-detail-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: 'Inter', sans-serif;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2c7a4d;
      text-decoration: none;
      margin-bottom: 24px;
      font-weight: 500;
      transition: transform 0.2s;
    }
    .back-link:hover {
      transform: translateX(-4px);
    }

    .course-header {
      background: linear-gradient(135deg, #1e3c2c, #2c7a4d);
      border-radius: 32px;
      padding: 40px;
      color: white;
      margin-bottom: 32px;
    }
    .course-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .course-meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    .meta-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
    }

    .course-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .main-info {
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e3c2c;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eef2f0;
    }
    .info-label {
      font-weight: 600;
      color: #5b6e8c;
    }
    .info-value {
      font-weight: 500;
      color: #1e293b;
    }
    .exam-badge {
      display: inline-block;
      background: #eef6f2;
      color: #2c7a4d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .btn-apply, .btn-download, .btn-department {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s;
    }
    .btn-apply {
      background: #2c7a4d;
      color: white;
    }
    .btn-apply:hover {
      background: #1e5a38;
      transform: translateY(-2px);
    }
    .btn-download {
      background: #f5c518;
      color: #1a1a2e;
    }
    .btn-download:hover {
      background: #d4a800;
      transform: translateY(-2px);
    }
    .btn-department {
      background: transparent;
      color: #2c7a4d;
      border: 2px solid #2c7a4d;
    }
    .btn-department:hover {
      background: #2c7a4d;
      color: white;
      transform: translateY(-2px);
    }
    .loading-state, .error-state {
      text-align: center;
      padding: 60px;
      font-size: 1.1rem;
      color: #5b6e8c;
    }
    @media (max-width: 768px) {
      .course-header { padding: 24px; }
      .course-header h1 { font-size: 1.5rem; }
      .action-buttons { flex-direction: column; }
      .btn-apply, .btn-download, .btn-department { text-align: center; }
    }
  </style>
</head>
<body>
  <header id="mainNavbar"></header>

  <div class="course-detail-wrapper" id="courseDetailContainer">
    <a href="courses.html" class="back-link">← Back to All Courses</a>
    <div id="courseContent">Loading course details...</div>
  </div>

  <footer id="mainFooter"></footer>

  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/navbar.js"></script>
<script>
  buildNavbar('courses');

  async function loadFooter() {
    try {
      const res = await fetch('/');
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const footer = doc.querySelector('footer');
      if (footer) document.getElementById('mainFooter').innerHTML = footer.outerHTML;
    } catch(e) { console.log('Footer load failed'); }
  }
  loadFooter();

  // Get course ID from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  const courseId = urlParams.get('id');

  // Helper: Extract Level from Name (same as courses.html)
  function getCourseLevelFromName(name) {
    const match = (name || '').match(/Level\s*(\d+)/i);
    if (match) {
      const level = parseInt(match[1]);
      if (level === 6) return 'Diploma (Level 6)';
      if (level === 5) return 'Certificate (Level 5)';
      if (level === 4) return 'Artisan (Level 4)';
      return `Level ${level}`;
    }
    return 'Short Courses'; // fallback
  }

  async function loadCourseDetails() {
    if (!courseId) {
      document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ No course selected. <a href="courses.html">Return to courses</a></div>';
      return;
    }

    try {
      const res = await fetch(`/api/v1/courses/${courseId}`);
      const data = await res.json();
      
      if (!data.success || !data.data) {
        document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ Course not found. <a href="courses.html">Return to courses</a></div>';
        return;
      }

      const course = data.data;
      const departmentName = course.department?.name || 'General';
      const departmentId = course.department?.id;
      
      // 1. Determine level display correctly (parses "Level X" from name)
      const levelDisplay = getCourseLevelFromName(course.name);

      // 2. Format duration and modules from module_count
      let durationDisplay = '';
      const mc = course.module_count ?? 0;
      if (mc === 6) durationDisplay = '6 Modules · 3 Years (Diploma – Level 6)';
      else if (mc === 4) durationDisplay = '4 Modules · 2 Years (Certificate – Level 5)';
      else if (mc === 2) durationDisplay = '2 Modules · 1 Year (Craft Certificate – Level 4)';
      else if (mc === 1) durationDisplay = '1 Module · 6 Months (Artisan – Level 3)';
      else durationDisplay = '3 Weeks (Short / Internal Course)';

      // Flat-rate fees: Ksh 22,396 per module for all accredited programmes
      const FEE_PER_MODULE = 22396;
      let feesHtml = '';
      if (mc === 0) {
        feesHtml = '<div class="info-row"><span class="info-label" style="color:#888;">Short courses — fees vary. Contact admissions.</span></div>';
      } else {
        for (let m = 1; m <= mc; m++) {
          feesHtml += `
            <div class="info-row">
              <span class="info-label">Module ${m}</span>
              <span class="info-value">Ksh ${FEE_PER_MODULE.toLocaleString()}</span>
            </div>
          `;
        }
        feesHtml += `
          <div class="info-row" style="border-top:1px solid #e5e7eb;margin-top:6px;padding-top:6px;">
            <span class="info-label" style="font-weight:700;">Total Programme Fee</span>
            <span class="info-value" style="font-weight:700;color:#1a7a1a;">Ksh ${(mc * FEE_PER_MODULE).toLocaleString()}</span>
          </div>
        `;
      }

      // Intake dates from admin panel
      let intakesHtml = '<div class="info-row"><span class="info-label" style="color:#888;">No upcoming intake dates set. Contact admissions for the latest schedule.</span></div>';
      if (course.intake_dates && course.intake_dates.length > 0) {
        intakesHtml = '';
        course.intake_dates.forEach(intake => {
          const dateStr = intake.date
            ? new Date(intake.date).toLocaleDateString('en-KE', { year: 'numeric', month: 'long', day: 'numeric' })
            : 'TBA';
          intakesHtml += `
            <div class="info-row">
              <span class="info-label">${escapeHtml(intake.label || 'Intake')}</span>
              <span class="info-value">${dateStr}</span>
            </div>
          `;
        });
      }

      const html = `
        <div class="course-header">
          <h1>${escapeHtml(course.name)}</h1>
          <p>${escapeHtml(course.description || 'Comprehensive TVET program designed for industry readiness and practical skills development.')}</p>
          <div class="course-meta-badges">
            <span class="meta-badge">🏛️ ${escapeHtml(departmentName)}</span>
            <span class="meta-badge">📚 ${levelDisplay}</span>
            <span class="meta-badge">📋 ${escapeHtml(course.examining_body || 'N/A')}</span>
            ${course.cbet_status ? '<span class="meta-badge">✅ CBET Accredited</span>' : ''}
          </div>
        </div>
        
        <div class="course-grid">
          <div class="main-info">
            <div class="section-title">📖 Program Overview</div>
            <div class="info-row">
              <span class="info-label">Duration</span>
              <span class="info-value">${durationDisplay}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Examining Body</span>
              <span class="info-value"><span class="exam-badge">${escapeHtml(course.examining_body || 'N/A')}</span></span>
            </div>
            ${course.entry_requirements ? `
            <div class="info-row">
              <span class="info-label">Entry Requirements</span>
              <span class="info-value">${escapeHtml(course.entry_requirements)}</span>
            </div>
            ` : ''}
            
            <div class="section-title" style="margin-top: 32px;">💰 Fee Structure</div>
            ${feesHtml}
            
            <div class="section-title" style="margin-top: 32px;">📅 Intake Dates</div>
            ${intakesHtml}
            
            <div class="action-buttons">
              <a href="admissions.html" class="btn-apply">Apply Now →</a>
              <a href="downloads.html" class="btn-download">Download Brochure</a>
              <a href="departments.html#dept-${departmentId}" class="btn-department">← View Department Page</a>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('courseContent').innerHTML = html;
      
    } catch (err) {
      console.error('Failed to load course:', err);
      document.getElementById('courseContent').innerHTML = '<div class="error-state">❌ Unable to load course details. Please try again later.</div>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadCourseDetails();
</script>
</body>
</html>
