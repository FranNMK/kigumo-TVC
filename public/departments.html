<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Academic and Non-Academic Departments at Kigumo Technical and Vocational College">
    <meta name="theme-color" content="#2c7a4d">
    <title>Departments - Kigumo Technical and Vocational College</title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fefefe;
            color: #1a2c3e;
            line-height: 1.6;
        }

        /* Page Hero */
        .page-hero {
            background: linear-gradient(135deg, #0f2b3d, #2c7a4d);
            color: white;
            text-align: center;
            padding: 4rem 2rem 2.5rem;
        }

        .page-hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .page-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Department Content */
        .dept-content {
            animation: fadeIn 0.3s ease;
            padding: 48px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Two-Column */
        .dept-hero {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 48px;
            align-items: center;
            margin-bottom: 40px;
        }

        .hero-badge {
            display: inline-block;
            background: #e8f3ec;
            color: #2c7a4d;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .dept-hero h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .welcome-text {
            background: #fafcfb;
            border-left: 4px solid #2c7a4d;
            border-radius: 16px;
            padding: 20px 24px;
            font-size: 1rem;
            color: #2c3e44;
            line-height: 1.6;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .dept-image {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            background: #f0f2f5;
            aspect-ratio: 4/3;
        }

        .dept-image:hover {
            transform: scale(1.01);
        }

        .dept-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #2c7a4d;
            background: #eef6f2;
        }

        /* HOD Bar */
        .hod-bar {
            background: #f0f7f0;
            border-left: 4px solid #2c7a4d;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hod-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            background: #d4e6d4;
            flex-shrink: 0;
        }

        .hod-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hod-photo .placeholder-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .hod-info h4 {
            color: #2c7a4d;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .hod-info span {
            color: #4a5b6e;
            font-size: 0.85rem;
        }

        /* Sub Tabs */
        .sub-tabs-wrapper {
            margin-bottom: 32px;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        .sub-tabs {
            display: flex;
            gap: 0;
            min-width: max-content;
        }

        .sub-tab {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background: none;
            border: none;
            color: #4a5b6e;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }

        .sub-tab:hover {
            color: #2c7a4d;
        }

        .sub-tab.active {
            color: #2c7a4d;
            border-bottom-color: #2c7a4d;
        }

        /* Sub Tab Content */
        .subtab-pane {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .subtab-pane.active {
            display: block;
        }

        /* Overview Grid */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin: 32px 0 48px;
        }

        .overview-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .overview-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            background: #eef6f2;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-circle svg {
            width: 28px;
            height: 28px;
            stroke: #2c7a4d;
            stroke-width: 1.7;
            fill: none;
        }

        .overview-card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 12px;
        }

        .overview-card p {
            font-size: 0.95rem;
            color: #2c3e44;
            line-height: 1.6;
        }

        /* Course Grid */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin: 32px 0 48px;
        }

        .course-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .exam-badge {
            background: #eef2fa;
            color: #1e4663;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .level-tag {
            background: #f2f4f6;
            color: #4a5b6e;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .course-card h4 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .course-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c7a4d;
            font-weight: 500;
            font-size: 0.85rem;
            margin-top: 12px;
        }

        .course-meta svg {
            width: 16px;
            height: 16px;
            stroke: #2c7a4d;
            stroke-width: 1.8;
            fill: none;
        }

        /* CTA Section */
        .cta-section {
            background: #eef6f2;
            border-radius: 32px;
            padding: 48px 32px;
            text-align: center;
            margin: 48px 0 64px;
        }

        .cta-section h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 16px;
        }

        .cta-section p {
            color: #2c3e44;
            margin-bottom: 32px;
        }

        .apply-btn {
            background: #2c7a4d;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .apply-btn:hover {
            background: #1e5a38;
            transform: scale(0.98);
        }

        /* Loading State */
        .loading-spinner {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #eef2f0;
            border-top-color: #2c7a4d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-message {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

        /* No Courses */
        .no-courses {
            text-align: center;
            padding: 48px 20px;
            color: #888;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .dept-hero {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .overview-grid,
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .page-hero h1 { font-size: 2rem; }
            .dept-hero h2 { font-size: 1.8rem; }
            .sub-tab { padding: 8px 16px; font-size: 0.85rem; }
            .overview-grid,
            .course-grid {
                grid-template-columns: 1fr;
            }
            .overview-card h3 { font-size: 1.4rem; }
            .cta-section { padding: 32px 24px; }
            .cta-section h3 { font-size: 1.5rem; }
        }
    </style>
</head>

<body>
    <header id="mainNavbar"></header>

    <section class="page-hero">
        <h1>Our Departments</h1>
        <p>Explore our academic programs and support services</p>
    </section>

    <div class="container">
        <div id="mainContent"></div>
        <div class="cta-section">
            <h3>Ready to Start Your Journey?</h3>
            <p>Join Kigumo Technical and Vocational College and gain practical skills for your future career.</p>
            <button class="apply-btn" onclick="window.location.href='/admissions.html'">Apply Now →</button>
        </div>
    </div>

    <footer id="mainFooter"></footer>

    <script src="assets/js/navbar.js"></script>
    <script>
        // Build navbar first
        buildNavbar('departments');
        
        let allDepartments = [];
        let currentDeptId = null;

        async function loadFooter() {
            try {
                const res = await fetch('/');
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const footer = doc.querySelector('footer');
                if (footer) document.getElementById('mainFooter').innerHTML = footer.outerHTML;
            } catch (e) {
                console.error('Footer load failed:', e);
            }
        }

        // Load all departments and check URL hash for specific department
        async function loadDepartments() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading departments...</p>
                </div>
            `;

            try {
                const res = await fetch('/api/v1/departments/with-courses');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.success) throw new Error('API returned success=false');
                
                allDepartments = data.data;
                
                // Check URL hash for department ID (e.g., #dept-5)
                let deptIdFromHash = null;
                if (window.location.hash && window.location.hash.startsWith('#dept-')) {
                    deptIdFromHash = parseInt(window.location.hash.replace('#dept-', ''));
                }
                
                // If hash exists and matches a department, show that one
                if (deptIdFromHash && allDepartments.find(d => d.id === deptIdFromHash)) {
                    currentDeptId = deptIdFromHash;
                    renderDepartmentContent(currentDeptId);
                } 
                // Otherwise show first academic department
                else {
                    const firstDept = allDepartments.find(d => d.type === 'academic') || allDepartments[0];
                    if (firstDept) {
                        currentDeptId = firstDept.id;
                        renderDepartmentContent(currentDeptId);
                    } else {
                        mainContent.innerHTML = '<p class="error-message">No departments found.</p>';
                    }
                }
            } catch (err) {
                console.error('API Error:', err);
                mainContent.innerHTML = `
                    <div class="error-message">
                        <p>⚠️ Unable to load departments. Please try again later.</p>
                    </div>
                `;
            }
        }

        function renderDepartmentContent(deptId) {
            const dept = allDepartments.find(d => d.id === deptId);
            if (!dept) {
                document.getElementById('mainContent').innerHTML = '<p class="error-message">Department not found.</p>';
                return;
            }
            
            const mainContent = document.getElementById('mainContent');
            
            // Group courses by examining_body (only for academic departments)
            const coursesByBody = {};
            let hasCourses = false;
            
            if (dept.type === 'academic' && dept.courses && dept.courses.length > 0) {
                hasCourses = true;
                dept.courses.forEach(course => {
                    const body = course.examining_body;
                    if (!coursesByBody[body]) coursesByBody[body] = [];
                    coursesByBody[body].push(course);
                });
            }
            
            const examiningBodies = Object.keys(coursesByBody);
            
            mainContent.innerHTML = `
                <div class="dept-content">
                    <div class="dept-hero">
                        <div>
                            <span class="hero-badge">${dept.type === 'academic' ? 'Academic Department' : 'Support Department'}</span>
                            <h2>${escapeHtml(dept.name)}</h2>
                            <div class="welcome-text">
                                ${escapeHtml(dept.description || 'Welcome to the ' + dept.name + ' department. We are committed to excellence in technical and vocational training.')}
                            </div>
                        </div>
                        <div class="dept-image">
                            ${dept.image_path ? 
                                `<img src="${dept.image_path}" alt="${escapeHtml(dept.name)}" loading="lazy">` : 
                                `<div class="placeholder-image">${dept.type === 'academic' ? '📚' : '🤝'}</div>`
                            }
                        </div>
                    </div>
                    
                    ${dept.hod_name ? `
                    <div class="hod-bar">
                        <div class="hod-photo">
                            ${dept.hod_photo ? 
                                `<img src="${dept.hod_photo}" alt="${escapeHtml(dept.hod_name)}">` : 
                                `<div class="placeholder-icon">👤</div>`
                            }
                        </div>
                        <div class="hod-info">
                            <h4>${escapeHtml(dept.hod_name)}</h4>
                            <span>Head of Department</span>
                        </div>
                    </div>
                    ` : ''}
                    
                    ${dept.type === 'academic' ? `
                        <div class="sub-tabs-wrapper">
                            <div class="sub-tabs" id="subTabs-${dept.id}">
                                <button class="sub-tab active" data-subtab="overview-${dept.id}">Overview</button>
                                ${examiningBodies.map(body => `
                                    <button class="sub-tab" data-subtab="${body}-${dept.id}">${escapeHtml(body)}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div id="subtabContainer-${dept.id}">
                            <div class="subtab-pane active" id="overview-${dept.id}">
                                <div class="overview-grid">
                                    <div class="overview-card">
                                        <div class="icon-circle">
                                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg>
                                        </div>
                                        <h3>Vision</h3>
                                        <p>${escapeHtml(dept.vision || 'To be a center of excellence in technical and vocational training, producing competent graduates for industry and enterprise.')}</p>
                                    </div>
                                    <div class="overview-card">
                                        <div class="icon-circle">
                                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                            </svg>
                                        </div>
                                        <h3>Mission</h3>
                                        <p>${escapeHtml(dept.mission || 'To provide quality, industry-driven training that equips students with practical skills and entrepreneurial mindset.')}</p>
                                    </div>
                                    <div class="overview-card">
                                        <div class="icon-circle">
                                            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                                                <circle cx="12" cy="12" r="10"/>
                                                <line x1="12" y1="8" x2="12" y2="12"/>
                                                <line x1="12" y1="16" x2="12.01" y2="16"/>
                                            </svg>
                                        </div>
                                        <h3>Key Objective</h3>
                                        <p>${escapeHtml(dept.objective || 'To produce competent graduates who meet TVET standards and industry demands through hands-on training and innovation.')}</p>
                                    </div>
                                </div>
                            </div>
                            ${hasCourses ? examiningBodies.map(body => `
                                <div class="subtab-pane" id="${body}-${dept.id}">
                                    <div class="course-grid">
                                        ${coursesByBody[body].map(course => `
                                            <div class="course-card">
                                                <div class="card-header">
                                                    <span class="exam-badge">${escapeHtml(course.examining_body)}</span>
                                                    ${course.level ? `<span class="level-tag">${escapeHtml(course.level)}</span>` : ''}
                                                </div>
                                                <h4>${escapeHtml(course.name)}</h4>
                                                <div class="course-meta">
                                                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                                                        <line x1="8" y1="10" x2="16" y2="10"/>
                                                    </svg>
                                                    <span>${course.cbet_status ? 'CBET Curriculum' : 'Standard Curriculum'}</span>
                                                    <span>•</span>
                                                    <span>${
                                                      course.module_count === 6 ? '3 Years' :
                                                      course.module_count === 4 ? '2 Years' :
                                                      course.module_count === 2 ? '1 Year' :
                                                      course.module_count === 1 ? '6 Months' : 'Short Course'
                                                    }</span>
                                                </div>
                                                ${course.entry_requirements ? `<div class="course-meta" style="margin-top:8px;color:#4a5b6e;">📋 ${escapeHtml(course.entry_requirements.substring(0, 60))}${course.entry_requirements.length > 60 ? '...' : ''}</div>` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('') : ''}
                        </div>
                    ` : `
                        <!-- Non-academic departments show simplified view -->
                        <div style="margin: 32px 0 48px;">
                            <div style="background: white; border-radius: 20px; padding: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);">
                                <h3 style="color: #2c7a4d; margin-bottom: 16px;">Department Overview</h3>
                                <p style="color: #2c3e44; line-height: 1.8;">${escapeHtml(dept.description || 'This department plays a vital role in supporting the academic mission of Kigumo Technical and Vocational College.')}</p>
                            </div>
                        </div>
                    `}
                </div>
            `;
            
            // Attach sub-tab click handlers for academic departments
            if (dept.type === 'academic') {
                const subTabsContainer = document.getElementById(`subTabs-${dept.id}`);
                if (subTabsContainer) {
                    subTabsContainer.querySelectorAll('.sub-tab').forEach(tab => {
                        tab.addEventListener('click', function() {
                            const subtabId = this.dataset.subtab;
                            subTabsContainer.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                            this.classList.add('active');
                            
                            const container = document.getElementById(`subtabContainer-${dept.id}`);
                            container.querySelectorAll('.subtab-pane').forEach(pane => pane.classList.remove('active'));
                            const targetPane = document.getElementById(subtabId);
                            if (targetPane) targetPane.classList.add('active');
                        });
                    });
                }
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Listen for hash changes (when user clicks navbar dropdown links)
        window.addEventListener('hashchange', function() {
            if (window.location.hash && window.location.hash.startsWith('#dept-')) {
                const deptId = parseInt(window.location.hash.replace('#dept-', ''));
                const dept = allDepartments.find(d => d.id === deptId);
                if (dept && currentDeptId !== deptId) {
                    currentDeptId = deptId;
                    renderDepartmentContent(currentDeptId);
                    // Scroll to top of content
                    document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
                }
            }
        });
        
        // Initialize
        (async function init() {
            await loadFooter();
            await loadDepartments();
        })();
    </script>
</body>

</html>
