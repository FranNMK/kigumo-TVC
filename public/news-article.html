<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- title, description, canonical, og:* and JSON-LD are injected by JS once the article loads -->
  <meta name="description" content="News article — Kigumo Technical and Vocational College" />
  <meta name="theme-color" content="#1a7a1a" />
  <title>News — Kigumo Technical and Vocational College</title>
  <link rel="canonical" href="https://kigumotvc.ac.ke/news.html" />

  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg" />
  <link rel="stylesheet" href="assets/css/main.css" />

  <style>
    .article-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .article-header {
      margin-bottom: 2rem;
    }
    .category-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .cat-event { background: #cce5ff; color: #004085; }
    .cat-partnership { background: #d4edda; color: #155724; }
    .cat-graduation { background: #fff3cd; color: #856404; }
    .cat-achievement { background: #f8d7da; color: #721c24; }
    .cat-general { background: #e2e3e5; color: #383d41; }
    .article-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.3;
      margin-bottom: 0.8rem;
    }
    .article-date {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .article-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 2rem;
      background: #e0e0e0;
    }
    .article-body {
      font-size: 1.1rem;
      line-height: 1.85;
      color: #333;
    }
    .article-body p {
      margin-bottom: 1.2rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 2.5rem;
      color: #1a7a1a;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .error-message {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }
    @media (max-width: 768px) {
      .article-title { font-size: 1.6rem; }
      .article-body { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header id="mainNavbar"></header>

  <div class="article-container" id="articleContent">
    <p style="text-align:center;color:#888;padding:3rem;">Loading article...</p>
  </div>

  <footer id="mainFooter"></footer>

  <script src="assets/js/navbar.js"></script>
  <script>
    buildNavbar('news');

    // Get article ID from URL
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');

    async function loadSharedComponents() {
      try {
        const res = await fetch('/');
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const nav = doc.querySelector('header');
        const footer = doc.querySelector('footer');
        if (nav) document.getElementById('mainNavbar').innerHTML = nav.outerHTML;
        if (footer) document.getElementById('mainFooter').innerHTML = footer.outerHTML;
      } catch (e) {}
    }

    async function loadArticle() {
      const container = document.getElementById('articleContent');

      if (!articleId) {
        container.innerHTML = '<div class="error-message"><h2>No article specified</h2><p>Please select an article from the <a href="news.html">news page</a>.</p></div>';
        return;
      }

      try {
        const res = await fetch(`/api/v1/news/${articleId}`);
        if (!res.ok) throw new Error('Article not found');
        const data = await res.json();

        if (!data.success || !data.data) {
          container.innerHTML = '<div class="error-message"><h2>Article not found</h2><p>The article you are looking for does not exist or has been removed.</p><p><a href="news.html">← Back to News</a></p></div>';
          return;
        }

        const article = data.data;
        const date = new Date(article.published_at).toLocaleDateString('en-KE', {
          year: 'numeric', month: 'long', day: 'numeric'
        });

        // Handle image path
        let imageHtml = '';
        if (article.image_path) {
          let imgSrc = article.image_path;
          if (!imgSrc.startsWith('http://') && !imgSrc.startsWith('https://')) {
            imgSrc = '/' + imgSrc.replace(/^\/?(uploads\/)?/, 'uploads/');
          }
          imageHtml = `<img src="${imgSrc}" alt="${escapeHtml(article.title)}" class="article-image" />`;
        }

        container.innerHTML = `
          <div class="article-header">
            <span class="category-badge cat-${article.category}">${capitalizeFirst(article.category)}</span>
            <h1 class="article-title">${escapeHtml(article.title)}</h1>
            <p class="article-date">📅 ${date}</p>
          </div>
          ${imageHtml}
          <div class="article-body">${article.body}</div>
          <a href="news.html" class="back-link">← Back to News</a>
        `;

        // ── SEO: inject unique title, description, canonical, OG tags, and JSON-LD ──
        const pageTitle = `${article.title} — Kigumo TVC`;
        const bodyText = (() => { const d = document.createElement('div'); d.innerHTML = article.body || ''; return d.textContent || d.innerText || ''; })();
        const pageDesc = bodyText.substring(0, 155).replace(/\s+$/, '') + (bodyText.length > 155 ? '...' : '');
        const pageUrl = `https://kigumotvc.ac.ke/news-article.html?id=${articleId}`;

        document.title = pageTitle;

        let metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', pageDesc);

        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.appendChild(canonical); }
        canonical.href = pageUrl;

        const imgForOg = article.image_path
          ? (article.image_path.startsWith('http') ? article.image_path : `https://kigumotvc.ac.ke/uploads/${article.image_path.replace(/^\/?(uploads\/)?/, '')}`)
          : 'https://kigumotvc.ac.ke/assets/images/logo.jpeg';

        const ogTags = {
          'og:type': 'article',
          'og:title': pageTitle,
          'og:description': pageDesc,
          'og:url': pageUrl,
          'og:image': imgForOg,
          'og:site_name': 'Kigumo Technical and Vocational College'
        };
        Object.entries(ogTags).forEach(([prop, content]) => {
          let el = document.querySelector(`meta[property="${prop}"]`);
          if (!el) { el = document.createElement('meta'); el.setAttribute('property', prop); document.head.appendChild(el); }
          el.setAttribute('content', content);
        });

        // JSON-LD: NewsArticle schema
        const existingLd = document.getElementById('articleJsonLd');
        if (existingLd) existingLd.remove();
        const ld = document.createElement('script');
        ld.id = 'articleJsonLd';
        ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "NewsArticle",
          "headline": article.title,
          "description": pageDesc,
          "url": pageUrl,
          "image": imgForOg,
          "datePublished": article.published_at,
          "publisher": {
            "@type": "EducationalOrganization",
            "name": "Kigumo Technical and Vocational College",
            "url": "https://kigumotvc.ac.ke",
            "logo": { "@type": "ImageObject", "url": "https://kigumotvc.ac.ke/assets/images/logo.jpeg" }
          }
        });
        document.head.appendChild(ld);

      } catch (e) {
        container.innerHTML = '<div class="error-message"><h2>Error loading article</h2><p>Unable to load the article. Please try again later.</p><p><a href="news.html">← Back to News</a></p></div>';
      }
    }

    function capitalizeFirst(str) {
      if (!str) return '';
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    (async function () {
      await loadSharedComponents();
      await loadArticle();
    })();
  </script>
</body>
</html>
